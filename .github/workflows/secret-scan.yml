name: PARAMSATHYA-SEC-001 Secret Scan & Bundle Audit

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read
  security-events: write

jobs:
  secret-audit-gate:
    name: Red/Blue Team Secret & Bundle Exposure Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Run Gitleaks Full History Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run TruffleHog Filesystem & History Scan (Verification Disabled)
        uses: trufflesecurity/trufflehog@02b8e2f0a1b1f7141f2d9b8f38b0a17c98f3f4a1 # v3.88.0
        with:
          path: ./
          extra_args: --no-verification --results=unverified,unknown --fail

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle (Zero Real Credentials)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          SYNC_TTS_ENABLED: "false"
          SYNC_DEMO_GENERATION_ENABLED: "false"
        run: npm run build

      - name: Run Deterministic Exact-Value & Bundle Exposure Audit
        run: node scripts/security/secret-exposure-audit.mjs

      - name: Verify Package Contents Gate (npm pack --dry-run)
        run: npm pack --dry-run --json
