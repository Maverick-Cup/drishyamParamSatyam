<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#161b2c" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Gradient Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Glowing Support Heart above Hand -->
  <path d="M32 23.5 C32 23.5 27 18 23.5 21.5 C20 25 24 29 32 35 C40 29 44 25 40.5 21.5 C37 18 32 23.5 32 23.5 Z" fill="url(#heartGrad)" filter="url(#glow)" />

  <!-- Support Hand (Caring/Holding Position - Like LinkedIn Support Reaction) -->
  <path d="M16 43 C16 41 18.5 39 21.5 39 C24 39 26 40.5 28.5 40.5 C31 40.5 33 39 36 39 C38.5 39 41 40 43.5 41.5 C46.5 43.3 48 46 48 48 C48 49 46.5 50 44 50 L20 50 C17.5 50 16 48.5 16 47 C16 45.5 16 44 16 43 Z" fill="url(#handGrad)" />

  <!-- Cupped Palm / Thumb Detail -->
  <path d="M19 40 C19 36.5 21.5 34 24.5 34 C26.5 34 28 35 29.5 36.5" fill="none" stroke="url(#handGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
